# ====================================================================
# BLASTI — Build installers on every repo update
# ====================================================================
#
# What it does
#   1. Builds the Android APK (release) whenever master is pushed.
#   2. Builds the desktop installers per OS:
#        windows-latest -> NSIS .exe | macos-latest -> .dmg | ubuntu-latest -> .AppImage + .deb
#   3. Uploads every installer to the cloud API ("Public Apps Settings"):
#        POST /api/app-versions/upload?create=1   (x-deploy-token: <DEPLOY_TOKEN>)
#      Uploaded versions land as DRAFTS — open Admin -> Public Apps
#      Settings and press "Activate" on the version that should be
#      public for each platform.
#
# One-time setup (GitHub repo -> Settings):
#   Secrets -> Actions -> new repository secret:
#     BLASTI_DEPLOY_TOKEN  = value of DEPLOY_TOKEN in /etc/blasti/blasti.env
#                            (on the droplet:  grep DEPLOY_TOKEN /etc/blasti/blasti.env)
#   Variables -> Actions -> new repository variable:
#     BLASTI_API_URL       = public origin of the server, e.g. https://blasti.example.com
#                            (NO trailing slash, NO /api suffix)
#   Missing secrets => builds still run, upload step is skipped and the
#   installers stay available as workflow artifacts.
#
# Manual runs: Actions -> Build Installers -> Run workflow
#   (checkbox "Upload installers to the server" controls publishing)
#
# Signing (optional, Android): add secrets ANDROID_KEYSTORE_B64 (base64 of
# your .keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD — the release APK is then signed, otherwise it is
# built unsigned exactly like a local `bun run mobile:apk:release`.
#
# Note on GitHub Actions minutes: private repos get a monthly free quota
# (~2000 min). A full run (3 OS matrix) costs roughly 40-60 min of quota;
# pushes to master cancel superseded runs automatically (concurrency group).
# ====================================================================

name: Build Installers

on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload installers to the server (Public Apps Settings)'
        type: boolean
        default: true

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Android APK
  # ─────────────────────────────────────────────────────────────────
  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install

      - name: Build release APK (web export + cap sync + gradle)
        run: bun run mobile:apk:release

      - name: Sign APK (optional, needs keystore secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BLASTI_KEYSTORE_PATH: ${{ runner.temp }}/blasti.keystore
          BLASTI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BLASTI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BLASTI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$BLASTI_KEYSTORE_PATH"
          bun run mobile:apk:release

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp -f BLASTI-*.apk artifacts/ 2>/dev/null || true
          cp -f apps/mobile/android/app/build/outputs/apk/release/*.apk artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Desktop installers (NSIS / DMG / AppImage+deb)
  # ─────────────────────────────────────────────────────────────────
  build-desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      # no code-signing certificates on CI — build unsigned installers
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build web export (embedded in the desktop app)
        run: bun run build:export

      - name: Build desktop installer (electron-builder)
        run: bun run build
        working-directory: apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # Publish installers to the server (Public Apps Settings) as drafts
  # ─────────────────────────────────────────────────────────────────
  publish:
    name: Publish to Public Apps Settings
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # push to master / tag => publish · manual run => publish only when asked
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show downloaded files
        run: ls -la dist/

      - name: Upload installers to the server
        env:
          BLASTI_API_URL: ${{ vars.BLASTI_API_URL }}
          BLASTI_DEPLOY_TOKEN: ${{ secrets.BLASTI_DEPLOY_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -u
          if [ -z "${BLASTI_API_URL:-}" ] || [ -z "${BLASTI_DEPLOY_TOKEN:-}" ]; then
            echo "BLASTI_API_URL / BLASTI_DEPLOY_TOKEN not configured - skipping upload."
            echo "The installers remain available as workflow artifacts."
            exit 0
          fi

          MOBILE_VERSION="$(grep -oP 'versionName "\K[0-9.]+' apps/mobile/android/app/build.gradle | head -1 || true)"
          MOBILE_CODE="$(grep -oP 'versionCode \K[0-9]+' apps/mobile/android/app/build.gradle | head -1 || echo 0)"
          DESKTOP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          SHORT_SHA="${GIT_SHA::7}"
          FAILED=0

          echo "mobile version: $MOBILE_VERSION (code $MOBILE_CODE) · desktop version: $DESKTOP_VERSION"

          # upload <file> <platform> <version> <versionCode>
          upload() {
            local f="$1" platform="$2" ver="$3" vcode="${4:-0}"
            if [ -z "$f" ]; then echo "::warning::no installer found for $platform - skipped"; return 0; fi
            if [ -z "$ver" ]; then echo "::warning::no version detected for $platform - skipped"; return 0; fi
            echo "::group::Uploading $platform v$ver ($(basename "$f"))"
            if node scripts/publish-installer.mjs \
                 --file "$f" --platform "$platform" --version "$ver" \
                 --version-code "$vcode" \
                 --notes "CI build $SHORT_SHA (${{ github.event_name }})"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$platform upload failed"
              FAILED=1
            fi
          }

          APK="$(ls dist/BLASTI-*.apk 2>/dev/null | head -1 || true)"
          [ -z "$APK" ] && APK="$(ls dist/*.apk 2>/dev/null | head -1 || true)"
          upload "$APK" android "$MOBILE_VERSION" "$MOBILE_CODE"

          EXE="$(ls dist/*.exe 2>/dev/null | head -1 || true)"
          upload "$EXE" windows "$DESKTOP_VERSION" 0

          DMG="$(ls dist/*.dmg 2>/dev/null | head -1 || true)"
          upload "$DMG" mac "$DESKTOP_VERSION" 0

          APPIMG="$(ls dist/*.AppImage 2>/dev/null | head -1 || true)"
          [ -z "$APPIMG" ] && APPIMG="$(ls dist/*.deb 2>/dev/null | head -1 || true)"
          upload "$APPIMG" linux "$DESKTOP_VERSION" 0

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::one or more uploads failed"
            exit 1
          fi
          echo "All installers uploaded as DRAFTS."
          echo "Open the web app -> Admin -> Public Apps Settings and press Activate on the version to publish."
