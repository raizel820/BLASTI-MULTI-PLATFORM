name: Build Installers

# Builds the two user-facing installers on every push to master (and on
# demand via the Actions tab), then commits them back into the repo:
#
#   installer/desktop/BLASTI-Setup-<version>.exe   ← Windows NSIS installer
#   installer/mobile/BLASTI-v<version>-debug.apk   ← Android debug APK
#
# Layout rationale:
#   • desktop job runs on windows-latest — NSIS + electron-builder are native
#     there, no emulation, no wine needed.
#   • mobile job runs on ubuntu-latest — Android SDK is preinstalled and the
#     repo's scripts/gradle.js auto-detects JAVA_HOME (set by setup-java) and
#     the SDK path, and even copies the finished APK to the repo root itself.
#   • A separate `publish-installers` job (needs: both builds) does the single
#     git commit, so the two build jobs can never race on `git push`.
#   • Commit message carries [skip ci] and the push trigger ignores
#     installer/** — no infinite build loop.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'worklog.md'
      - 'installer/**'
      - 'download/**'

permissions:
  contents: write

concurrency:
  group: build-installers
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  desktop-exe:
    name: Desktop .exe (Windows NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web static export (apps/web → out/)
        run: bun run build:export
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Package Windows installer (prebuild + electron-builder NSIS)
        run: bun run --filter @blasti/desktop build:win

      - name: Collect installer into installer/desktop/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/desktop | Out-Null
          Copy-Item apps/desktop/dist/BLASTI-Setup-*.exe -Destination installer/desktop/ -Force
          Get-ChildItem installer/desktop | Format-Table Name, Length

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-exe
          path: installer/desktop/*.exe
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  mobile-apk:
    name: Mobile debug APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Capacitor 8 / AGP 8.x require JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK is preinstalled on ubuntu runners; accepting the licenses
      # lets AGP auto-download any missing platform/build-tool (e.g. android-36).
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Web export → cap sync android → gradlew assembleDebug
      # (scripts/gradle.js then copies the APK to the repo root as
      #  BLASTI-v<versionName>-debug.apk)
      - name: Build debug APK
        run: bun run --filter @blasti/mobile build:android:debug
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Collect APK into installer/mobile/
        run: |
          mkdir -p installer/mobile
          if compgen -G "BLASTI-v*-debug.apk" > /dev/null; then
            cp -f BLASTI-v*-debug.apk installer/mobile/
          else
            # Fallback: newest APK straight from the gradle output dir
            cp -f apps/mobile/android/app/build/outputs/apk/debug/*.apk installer/mobile/
          fi
          ls -lh installer/mobile

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: installer/mobile/*.apk
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  publish-installers:
    name: Commit installers to installer/
    runs-on: ubuntu-latest
    needs: [desktop-exe, mobile-apk]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Refresh installer folders (drop previous versions)
        run: |
          rm -f installer/desktop/*.exe
          rm -f installer/mobile/*.apk

      - uses: actions/download-artifact@v4
        with:
          name: desktop-exe
          path: installer/desktop

      - uses: actions/download-artifact@v4
        with:
          name: mobile-apk
          path: installer/mobile

      - name: Commit & push updated installers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/
          if git diff --cached --quiet; then
            echo "No installer changes to commit."
          else
            git commit -m "ci: update installers — desktop .exe + mobile debug APK [skip ci]"
            git push
          fi

      - name: Write run summary
        run: |
          {
            echo "## 📦 Installers built"
            echo ""
            echo '```'
            ls -lh installer/desktop installer/mobile
            echo '```'
            echo ""
            echo "Committed to \`installer/\` on branch \`${GITHUB_REF_NAME}\` and attached as run artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
