name: Publish Installers (selective, no app rebuild)

# User request (2026-02): an ADDITIONAL GitHub Action that can generate ONLY
# selected installers (or all of them) and push them to the BLASTI VPS
# WITHOUT rebuilding the web app on the VPS.
#
# Difference from "Build Installers" (build-installers.yml):
#   • Manual (workflow_dispatch) ONLY — never runs on push.
#   • `targets` input: desktop-only · mobile-only · all — skips the other
#     build entirely (saves ~40 min of runner time when only one installer
#     is needed).
#   • NO deploy-trigger by default: the existing workflow POSTs
#     /api/system/deploy-trigger which rebuilds the WHOLE web app on the VPS
#     (git pull → bun install → db push → next build). Pushing installers
#     does not need that, so `trigger_vps_rebuild` defaults to FALSE — the
#     binaries land in VPS storage and appear as drafts in Public Apps
#     Settings with zero impact on the running site. Tick the box only when
#     the push accompanies a code change that must ship together.
#
# REQUIRED REPO SECRETS (same as build-installers.yml):
#   BLASTI_API_URL      e.g. https://blasti.example.com
#   BLASTI_DEPLOY_TOKEN the DEPLOY_TOKEN value from /etc/blasti/blasti.env

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which installers to build & push'
        type: choice
        default: all
        options:
          - all
          - desktop-only
          - mobile-only
      trigger_vps_rebuild:
        description: 'Also trigger the VPS web-app rebuild after upload?'
        type: boolean
        default: false

concurrency:
  group: publish-installers
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  desktop-exe:
    name: Desktop .exe (Windows NSIS)
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event.inputs.targets != 'mobile-only'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web static export (apps/web → out/)
        run: bun run build:export
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Package Windows installer (prebuild + electron-builder NSIS)
        run: bun run --filter @blasti/desktop build:win

      # DELTA UPDATES (0.6.30): snapshot the diffable references (app.asar +
      # out tree archive + runtime/native fingerprints) BEFORE dist/ is lost —
      # the cloud needs THIS release's refs to build the patch for the NEXT one.
      - name: Build release refs for delta updates
        shell: pwsh
        run: |
          $electron = (Get-Content apps/desktop/node_modules/electron/package.json | ConvertFrom-Json).version
          node scripts/make-release-refs.mjs `
            --unpacked apps/desktop/dist/win-unpacked `
            --out apps/desktop/dist/release-refs `
            --electron-version $electron

      - name: Collect installer into installer/desktop/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/desktop | Out-Null
          Copy-Item apps/desktop/dist/BLASTI-Setup-*.exe -Destination installer/desktop/ -Force
          Get-ChildItem installer/desktop | Format-Table Name, Length

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-exe
          path: installer/desktop/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Upload desktop release refs artifact (delta updates)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-refs
          path: apps/desktop/dist/release-refs/*
          retention-days: 30
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────────
  mobile-apk:
    name: Mobile debug APK (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.inputs.targets != 'desktop-only'
    steps:
      - uses: actions/checkout@v5

      # Capacitor 8 / AGP 8.x require JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Ensure gradlew is executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build debug APK
        run: bun run --filter @blasti/mobile build:android:debug
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Collect APK into installer/mobile/
        run: |
          mkdir -p installer/mobile
          if compgen -G "BLASTI-v*-debug.apk" > /dev/null; then
            cp -f BLASTI-v*-debug.apk installer/mobile/
          else
            cp -f apps/mobile/android/app/build/outputs/apk/debug/*.apk installer/mobile/
          fi
          ls -lh installer/mobile

      - name: Upload mobile APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: installer/mobile/*.apk
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────
  publish-to-vps:
    name: Push installers → BLASTI VPS (no app rebuild)
    runs-on: ubuntu-latest
    needs: [desktop-exe, mobile-apk]
    # Partial-publish mode: run even when one target was skipped (choice
    # inputs) or failed — upload whichever artifact exists.
    if: always() && (needs.desktop-exe.result == 'success' || needs.mobile-apk.result == 'success')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download desktop installer
        if: needs.desktop-exe.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: desktop-exe
          path: installer/desktop

      - name: Download desktop release refs (delta updates)
        if: needs.desktop-exe.result == 'success'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: desktop-release-refs
          path: release-refs

      - name: Download mobile APK
        if: needs.mobile-apk.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: mobile-apk
          path: installer/mobile

      - name: Upload installers to the VPS
        env:
          BLASTI_API_URL: ${{ secrets.BLASTI_API_URL }}
          BLASTI_DEPLOY_TOKEN: ${{ secrets.BLASTI_DEPLOY_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGETS: ${{ github.event.inputs.targets }}
        run: |
          set -e
          COMMIT_SHORT="${GITHUB_SHA::7}"
          if [ -z "$BLASTI_API_URL" ] || [ -z "$BLASTI_DEPLOY_TOKEN" ]; then
            echo "::warning::BLASTI_API_URL / BLASTI_DEPLOY_TOKEN secrets not configured — skipping VPS upload (artifacts are still on this run)."
            exit 0
          fi

          upload() { # <file> <platform> <fallback-version>
            local f="$1" platform="$2" ver=""
            case "$(basename "$f")" in
              BLASTI-Setup-*.exe)  ver="$(basename "$f" | sed -n 's/^BLASTI-Setup-\(.*\)\.exe$/\1/p')" ;;
              BLASTI-v*-debug.apk) ver="$(basename "$f" | sed -n 's/^BLASTI-v\(.*\)-debug\.apk$/\1/p')" ;;
            esac
            if [ -z "$ver" ]; then
              echo "::warning::could not parse a semver out of $(basename "$f") — falling back to $3"
              ver="$3"
            fi
            node scripts/publish-installer.mjs \
              --file "$f" \
              --platform "$platform" \
              --version "$ver" \
              --api-url "$BLASTI_API_URL" \
              --token "$BLASTI_DEPLOY_TOKEN" \
              --notes "Selective publish ($TARGETS) from commit ${COMMIT_SHORT:-manual} (run #${RUN_NUMBER})" \
              ${REF_ARGS}
          }

          # Delta refs (desktop only, when the artifact exists)
          REF_ARGS=""
          if [ -f release-refs/app.asar ] && [ -f release-refs/outref.bin ] && [ -f release-refs/refs.json ]; then
            REF_ARGS="--asar release-refs/app.asar --outref release-refs/outref.bin"
            REF_ARGS="$REF_ARGS --runtime-key $(node -p "JSON.parse(require('fs').readFileSync('release-refs/refs.json','utf8')).runtimeKey")"
            REF_ARGS="$REF_ARGS --native-fingerprint $(node -p "JSON.parse(require('fs').readFileSync('release-refs/refs.json','utf8')).nativeFingerprint")"
            echo "delta refs found — differential updates will be generated"
          else
            echo "no delta refs artifact — desktop updates fall back to full installers"
          fi

          uploaded=false
          for f in installer/desktop/*.exe; do
            if [ -f "$f" ]; then upload "$f" windows "0.0.0"; uploaded=true; fi
          done
          for f in installer/mobile/*.apk; do
            if [ -f "$f" ]; then upload "$f" android-debug "0.0.0"; uploaded=true; fi
          done
          if [ "$uploaded" != "true" ]; then
            echo "::warning::No installer files found to upload."
          fi

      - name: Trigger VPS web-app rebuild (OPTIONAL — off by default)
        if: github.event.inputs.trigger_vps_rebuild == 'true'
        env:
          BLASTI_API_URL: ${{ secrets.BLASTI_API_URL }}
          BLASTI_DEPLOY_TOKEN: ${{ secrets.BLASTI_DEPLOY_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Same contract as build-installers.yml — only run when the operator
          # explicitly asked for the app rebuild alongside this installer push.
          code="$(curl -fsS -m 60 -o /tmp/deploy-trigger.json -w '%{http_code}' \
            -X POST "${BLASTI_API_URL%/}/api/system/deploy-trigger" \
            -H 'Content-Type: application/json' \
            -H "x-deploy-token: $BLASTI_DEPLOY_TOKEN" \
            -d '{"source":"github-actions","commit":"'"$COMMIT_SHA"'","reason":"selective installer publish (run #'"$RUN_NUMBER"')"}')" || code="000"
          echo "Deploy trigger HTTP status: $code"

      - name: Write run summary
        if: always()
        env:
          API_URL: ${{ secrets.BLASTI_API_URL }}
          TARGETS: ${{ github.event.inputs.targets }}
          REBUILD: ${{ github.event.inputs.trigger_vps_rebuild }}
        run: |
          {
            echo "## 📦 Selective installer publish ($TARGETS)"
            echo ""
            echo "| Build | Result |"
            echo "|---|---|"
            echo "| desktop .exe | ${{ needs.desktop-exe.result }} |"
            echo "| mobile debug APK | ${{ needs.mobile-apk.result }} |"
            echo ""
            echo "**VPS web-app rebuild:** $REBUILD (off by default — installers only)"
            if [ -n "$API_URL" ]; then
              echo "**Delivered to:** ${API_URL%/} → Admin → Public Apps Settings (activate as published installer) · Storage → app-versions"
            else
              echo "**VPS upload:** skipped (secrets not configured) — download from this run's artifacts"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
