appId: com.blasti.desktop
productName: BLASTI
# Path-safe executable name — electron-builder 26.x derives executableName
# from the (scoped) package name "@blasti/desktop" → "@blastidesktop" and then
# REFUSES to build: "executableName contains characters that cannot be safely
# used in file paths". Installer FILE names still use ${productName}, so the
# artifacts stay BLASTI-Setup-x.y.z.exe / BLASTI-x.y.z.AppImage / .dmg.
executableName: blasti
copyright: Copyright © 2025 BLASTI

directories:
  output: dist
  buildResources: assets

# SIZE ROUND (0.6.69) — maximum NSIS/AppImage/dmg compression (LZMA ultra).
# Slower builds, measurably smaller installers on the electron+prisma payload.
compression: maximum

# SIZE ROUND (0.6.69) — ship ONLY the locales the app actually speaks.
# The electron dist carries ~55 Chromium locale .pak files (~15 MB) that
# nothing in the UI ever uses (the app's own i18n is ar/en/fr in the web
# layer; ar/en/fr Chromium locales keep native context menus correct).
electronLanguages:
  - ar
  - en
  - en-US
  - fr

# ─── Files to Package ───────────────────────────────────────────────────────
# Main process files, web app output, and local database.
# node_modules production deps are auto-included by electron-builder.
# NOTE: the runtime (schema migrations, sync registry) must be fully
# self-contained — production desktop must not depend on the monorepo
# packages/ tree, Prisma CLI, Bun or system Node (spec §27).
files:
  - main.js
  - preload.js
  # Task 71: load-env.js (the .env loader main.js requires at boot) was missing
  # from this allowlist — dev ran fine (real file on disk) but the packaged app
  # crashed with "Cannot find module './load-env'" on first launch.
  - load-env.js
  # Public App Settings rebuild: device install telemetry. main.js requires it
  # lazily (launch registration + 6h heartbeat + update polling). Same failure
  # class as load-env.js — dev works, packaged app would crash with
  # "Cannot find module './device-telemetry'" on first launch.
  - device-telemetry.js
  # Login unification + client attestation (0.6.48): main.js and
  # local-api/index.js both require ./client-attestation.js (HMAC attestation
  # header for cloud login). Same failure class as load-env.js — dev works,
  # packaged app would crash with "Cannot find module './client-attestation'"
  # on first launch. Caught by the check-packaging guard in CI.
  - client-attestation.js
  # 0.6.52 update observability: main.js requires ./update-log.js (the
  # dedicated update-pipeline diagnostic logger behind every updates:* IPC
  # handler + both boot self-heals). Same failure class as load-env.js —
  # missing it would crash EVERY packaged app at the first update check.
  - update-log.js
  - package.json
  - build-stamp.json
  - local-api/**/*
  # Keep the manual test scripts out of the production asar.
  - "!local-api/tests/**"
  - loading-screen.js
  - out/**/*
  - prisma/schema.prisma
  - prisma/generated/**/*
  # ─── SIZE ROUND (0.6.69) — dead runtime weight out of the package ──────
  # The generated SQLite client is SELF-CONTAINED at runtime: its index.js
  # requires ONLY ./runtime/library.js (verified against a fresh
  # `prisma generate` — zero external packages). Everything below (wasm
  # engines for OTHER database providers, edge/react-native/browser
  # variants, driver-adapter loaders, d.ts, source maps) is never loaded by
  # the packaged app — stripping it shrinks the asar AND the unpacked tree
  # (which is also what delta references/diffs are built from).
  - "!prisma/generated/client/query_engine_bg.js"
  - "!prisma/generated/client/query_engine_bg.wasm"
  - "!prisma/generated/client/wasm.js"
  - "!prisma/generated/client/wasm.d.ts"
  - "!prisma/generated/client/wasm-edge-light-loader.mjs"
  - "!prisma/generated/client/wasm-worker-loader.mjs"
  - "!prisma/generated/client/edge.js"
  - "!prisma/generated/client/edge.d.ts"
  - "!prisma/generated/client/index-browser.js"
  - "!prisma/generated/client/default.d.ts"
  - "!prisma/generated/client/index.d.ts"
  - "!prisma/generated/client/client.d.ts"
  - "!prisma/generated/client/**/*.map"
  - "!prisma/generated/client/runtime/edge.js"
  - "!prisma/generated/client/runtime/edge-esm.js"
  - "!prisma/generated/client/runtime/react-native.js"
  - "!prisma/generated/client/runtime/index-browser.js"
  - "!prisma/generated/client/runtime/index-browser.d.ts"
  - "!prisma/generated/client/runtime/wasm-engine-edge.js"
  - "!prisma/generated/client/runtime/wasm-compiler-edge.js"
  # Same dead weight inside the auto-collected @prisma/client runtime
  # package (if electron-builder manages to collect it from the bun store):
  # its runtime/ folder is ~73 MB of wasm-base64 engines for postgres /
  # mysql / sqlserver / cockroach / mongodb — the desktop runs SQLite via
  # the generated client's own self-contained runtime, never this.
  - "!node_modules/@prisma/client/runtime/**"
  - "!node_modules/@prisma/client/generator-build/**"
  - "!node_modules/@prisma/client/scripts/**"
  - "!node_modules/@prisma/client/*.md"
  - "!node_modules/@prisma/client/**/*.map"
  # The desktop SQLite Prisma client (prisma/generated) is also copied into
  # resources/node_modules/.prisma/client by scripts/after-pack.js (outside
  # asar — the query engine .node binary cannot load from inside an archive).
  # Prisma query engine + generated client are picked up from
  # node_modules automatically; the schema itself ships below via
  # extraResources for diagnostics/reference (migrations are embedded
  # in local-api/lib/schema-init-sql.js and need no CLI at runtime).

# ─── ASAR Configuration ─────────────────────────────────────────────────────
asar: true
asarUnpack:
  - out/**/*
  - prisma/generated/**/*

npmRebuild: true

# Task 55: copy @prisma/client + the generated .prisma/client (schema +
# platform query engine) from bun's isolated store into resources/node_modules
# after packing — electron-builder cannot follow bun's store layout itself.
afterPack: scripts/after-pack.js

# ─── Extra Resources (outside asar) ────────────────────────────────────────
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
  - from: data
    to: data
    filter:
      - "*.db"

# ─── Icon Configuration ───
# electron-builder auto-converts icon.png (1024x1024) to platform-specific formats.
# If icon.icns (mac) or icon.ico (win) exist, they take priority.
mac:
  category: public.app-category.business
  target:
    - target: dmg
      arch:
        - universal
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Required for native modules like better-sqlite3
  # npmRebuild in root config handles native module rebuild

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Task 2-b-1 (USER BUG: "when uninstall the app, delete all local stored data
  # so a new install will not reopen old offline sessions"): the uninstaller
  # must wipe the userData dir (%APPDATA%\BLASTI — local SQLite DB, file store,
  # logs, durable session file). build/installer.nsh additionally removes the
  # dirs deleteAppDataOnUninstall does NOT cover (dev-run userData, legacy
  # ~/.blasti data, updater caches) — see the path inventory documented there.
  deleteAppDataOnUninstall: true
  # NSIS hook script: customUnInstall macro removes every remaining BLASTI
  # data dir (build/installer.nsh, relative to apps/desktop).
  include: build/installer.nsh
  # NOTE: installerIcon/uninstallerIcon/installerHeaderIcon overrides REMOVED.
  # electron-builder now derives them from win.icon (assets/icon.png) and its
  # built-in header BMP. Forcing a 512x512 PNG into installerHeaderIcon made
  # NSIS abort with: Error in macro MUI_UNPAGE_INIT / MUI_UNPAGE_WELCOME /
  # !include: error in script: assistedInstaller.nsh (MUI2 header expects a
  # small BMP, not a large PNG).
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BLASTI
  # Allow the installed app to be run immediately after installation
  allowElevation: true

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Office
  icon: assets/icon.png
  # fpm requires a "Name <email>" maintainer (author-email check).
  maintainer: BLASTI Team <admin@blasti.dz>
  vendor: BLASTI

deb:
  # fpm package name + flat artifact name — the scoped "@blasti/desktop"
  # package name would otherwise produce a broken nested artifact path
  # (dist/@blasti/desktop_...deb — fpm aborts on the missing parent dir and
  # the CI artifact glob dist/*.deb would never match it either).
  packageName: blasti
  artifactName: "blasti_${version}_${arch}.${ext}"

publish:
  provider: generic
  url: https://releases.blasti.app/desktop
