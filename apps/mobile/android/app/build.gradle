apply plugin: 'com.android.application'

// Optional release signing via environment variables (used by CI).
// Locally nothing changes: without the env vars the release build stays
// unsigned exactly as before.
//   BLASTI_KEYSTORE_PATH / BLASTI_KEYSTORE_PASSWORD / BLASTI_KEY_ALIAS / BLASTI_KEY_PASSWORD
def blastiKeystorePath = System.getenv("BLASTI_KEYSTORE_PATH")
def blastiKeystoreConfigured = blastiKeystorePath != null && !blastiKeystorePath.trim().isEmpty() \
        && System.getenv("BLASTI_KEYSTORE_PASSWORD") != null \
        && file(blastiKeystorePath).exists()

// ─── STABLE DISTRIBUTION KEY (update-in-place fix) ───────────────────────────
// FIELD ROOT CAUSE: CI debug APKs were signed with the runner's EPHEMERAL
// debug keystore — a DIFFERENT signature on every CI run. Android therefore
// REFUSED to install any pushed update over an existing app
// ("App not installed" / install silently aborted → the old version stayed).
// Fresh installs worked; every update-in-place failed. The fix is one stable
// keystore committed to the repo (it is a distribution key for a self-hosted
// sideloaded app, not a store credential) used by BOTH debug and release so
// every build — local or CI — upgrades every installed device cleanly.
//   keystore : app/blasti-signing.p12 (PKCS12)
//   alias    : blasti
//   password : blasti-mobile
//   generated: JDK keytool (NOT openssl!) — openssl 3.5-produced PKCS12 files
//   fail JDK MAC verification even with the correct password ("keystore
//   password was incorrect" at :app:packageDebug). If this keystore ever
//   needs regenerating, always use keytool:
//     keytool -genkeypair -alias blasti -storetype PKCS12 \
//       -keystore app/blasti-signing.p12 -storepass blasti-mobile \
//       -keypass blasti-mobile -keyalg RSA -keysize 2048 -validity 10950 \
//       -dname "CN=BLASTI Mobile, O=BLASTI, C=NG"
// A per-run key still wins when BLASTI_KEYSTORE_PATH is provided (see above).
def stableKeystoreFile = file('blasti-signing.p12')
def stableKeystoreExists = stableKeystoreFile.exists()

android {
    namespace = "com.blasti.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.blasti.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6031
        versionName "0.6.31"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (stableKeystoreExists) {
            blastiStable {
                storeFile stableKeystoreFile
                storeType 'PKCS12'
                storePassword 'blasti-mobile'
                keyAlias 'blasti'
                keyPassword 'blasti-mobile'
            }
        }
        if (blastiKeystoreConfigured) {
            ciRelease {
                storeFile file(blastiKeystorePath)
                storePassword System.getenv("BLASTI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("BLASTI_KEY_ALIAS") ?: "blasti"
                keyPassword System.getenv("BLASTI_KEY_PASSWORD") ?: System.getenv("BLASTI_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // THE critical line for pushed updates: every debug APK (CI or
            // local) shares ONE signature, so Android installs it over the
            // previously installed debug build instead of failing with
            // "App not installed".
            if (stableKeystoreExists) {
                signingConfig signingConfigs.blastiStable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (blastiKeystoreConfigured) {
                signingConfig signingConfigs.ciRelease
            } else if (stableKeystoreExists) {
                signingConfig signingConfigs.blastiStable
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
