# ════════════════════════════════════════════════════════════════
# BLASTI — VPS DATABASE CONTAINER (PostgreSQL ONLY)
# ════════════════════════════════════════════════════════════════
# This is the ONLY thing Docker runs on the BLASTI VPS.
# Everything else runs NATIVELY on the host as systemd services:
#
#     blasti-api  → Bun  (Hono + Socket.IO)  127.0.0.1:3003
#     blasti-web  → Node (Next.js server)    127.0.0.1:3000
#     caddy       → apt package              0.0.0.0:80/443
#
# Installed + managed automatically by scripts/deploy-oracle-vps.sh
# (modes: server-install / server-update). Reference: DEPLOY-GUIDE.md.
#
# Run manually from the ops/ folder:
#     docker compose -f postgres.compose.yml \
#         --env-file /etc/blasti/blasti.env up -d
#
# SECURITY
#   • 5432 is published on 127.0.0.1 ONLY — the database is never
#     reachable from the internet (ufw does not open it either).
#   • All data lives in the named volume `blasti_pgdata`, which
#     survives reboots, redeploys and even container removal.
#   • Credentials come from /etc/blasti/blasti.env (never committed).
# ════════════════════════════════════════════════════════════════

name: blasti-db

services:
  db:
    image: postgres:16-alpine
    container_name: blasti-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blasti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /etc/blasti/blasti.env}
      POSTGRES_DB: ${POSTGRES_DB:-blasti}
    # ── Performance Round — sizing for the reference VPS (2 vCPU ARM, 12 GB) ──
    # Tuned via command-line args so the named volume needs NO config edits and
    # `docker compose up -d` alone applies them (data preserved). Defaults were
    # calibrated for 512 MB machines: shared_buffers 128 MB left every hot page
    # in the page cache and doubled the work per query on this box.
    #   shared_buffers 2 GB          → hot working set stays in Postgres cache
    #   effective_cache_size 6 GB    → planner budget incl. OS page cache
    #   maintenance_work_mem 256 MB  → faster index builds / autovacuum passes
    #   work_mem 8 MB                → per-sort budget (80 conns × few sorts ≈ safe)
    #   random_page_cost 1.1 / effective_io_concurrency 200 → NVMe/SSD reality
    #   wal_compression on + bigger wal/checkpoint windows → fewer fsync stalls
    #   max_connections 80           → API pool (10) + workers + admin console
    command:
      - postgres
      - -c
      - max_connections=80
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - track_io_timing=on
    # Parallel workers + big shared_buffers need more POSIX shm than Docker's
    # 64 MB default (parallel scans would otherwise fail with "out of shared
    # memory" under load).
    shm_size: 256mb
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-blasti} -d ${POSTGRES_DB:-blasti}']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
    name: blasti_pgdata
